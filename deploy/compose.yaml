services:
  moderation:
    image: ${MODERATION_IMAGE:?set by deploy.sh}
    restart: unless-stopped
    env_file: .env
    environment:
      HTTP_ADDR: ":8090"
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:${MODERATION_PORT:-8190}:8090"
    networks:
      - messenger
    healthcheck:
      test: ["CMD", "/app/moderation", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  messenger:
    external: true
    name: ${MESSENGER_NETWORK:-messenger-go_default}
