name: Deploy static page

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-page-${{ github.ref_type }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
      url: ${{ vars.DEPLOY_URL }}
    env:
      DEPLOY_ENV: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate deployment
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REPOSITORY" in
            myronsi/messenger-docs|myronsi/messenger-moderation) ;;
            *) exit 1 ;;
          esac

          if [[ "$DEPLOY_ENV" == production ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git merge-base --is-ancestor HEAD origin/main
          elif [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo 'A newer commit is on main. Skipping this staging deployment.'
            exit 0
          fi

          if [[ ! "$DEPLOY_URL" =~ ^https://[a-zA-Z0-9.-]+$ ||
                ! "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ||
                ! "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo '::error::Set DEPLOY_URL, SSH_HOST, and SSH_USER in this GitHub environment.'
            exit 1
          fi

          test -s index.html
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - name: Publish and verify
        if: steps.validate.outputs.deploy == 'true'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "$SSH_KEY" || -z "$SSH_KNOWN_HOSTS" ]]; then
            echo '::error::Set SSH_KEY and SSH_KNOWN_HOSTS in this GitHub environment.'
            exit 1
          fi

          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' "$SSH_KEY" > "$work/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$work/known_hosts"
          chmod 600 "$work/key" "$work/known_hosts"

          root="/var/www/${GITHUB_REPOSITORY##*/}-$DEPLOY_ENV"
          checksum="$(sha256sum index.html | cut -d ' ' -f 1)"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" \
            -i "$work/key" -l "$SSH_USER" "$SSH_HOST" \
            "set -eu
             tmp=\$(mktemp '$root/.index.XXXXXX')
             trap 'rm -f -- \"\$tmp\"' EXIT
             cat > \"\$tmp\"
             printf '%s  %s\n' '$checksum' \"\$tmp\" | sha256sum --check --status
             chmod 644 \"\$tmp\"
             mv -Tf -- \"\$tmp\" '$root/index.html'" < index.html

          curl --fail --silent --show-error --retry 3 --max-time 15 \
            --header 'Cache-Control: no-cache' "$DEPLOY_URL/?deploy=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$work/public.html"
          cmp index.html "$work/public.html"
