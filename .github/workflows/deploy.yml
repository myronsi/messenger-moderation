name: Deploy static page

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-page-${{ github.ref_type }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
      url: ${{ steps.validate.outputs.url }}
    env:
      DEPLOY_ENV: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate deployment
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REPOSITORY" in
            myronsi/messenger-docs) site=docs; account=msg-docs ;;
            myronsi/messenger-moderation) site=moderation; account=msg-mod ;;
            *) exit 1 ;;
          esac

          if [[ "$DEPLOY_ENV" == production ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git merge-base --is-ancestor HEAD origin/main
          elif [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo 'A newer commit is on main. Skipping this staging deployment.'
            exit 0
          fi

          domain="$site.messenger.viserix.com"
          if [[ "$DEPLOY_ENV" == staging ]]; then
            domain="$site.staging.messenger.viserix.com"
          fi

          test -s index.html
          printf 'url=https://%s\nuser=%s-%s\n' "$domain" "$account" "$DEPLOY_ENV" >> "$GITHUB_OUTPUT"

      - name: Publish and verify
        if: steps.validate.outputs.url != ''
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_URL: ${{ steps.validate.outputs.url }}
          SSH_USER: ${{ steps.validate.outputs.user }}
        run: |
          set -euo pipefail

          if [[ -z "$SSH_KEY" ]]; then
            echo '::error::Set SSH_KEY in this GitHub environment.'
            exit 1
          fi

          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' "$SSH_KEY" > "$work/key"
          printf '%s\n' 'messenger-static ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINn+Y95r3KWNKb/Ha9j0wd8f2C9uXkOyIgFbExH7q5BF' > "$work/known_hosts"
          chmod 600 "$work/key" "$work/known_hosts"

          checksum="$(sha256sum index.html | cut -d ' ' -f 1)"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" \
            -o HostKeyAlias=messenger-static -o HostKeyAlgorithms=ssh-ed25519 \
            -i "$work/key" -l "$SSH_USER" messenger.viserix.com \
            "publish $checksum" < index.html

          curl --fail --silent --show-error --retry 3 --max-time 15 \
            --header 'Cache-Control: no-cache' "$DEPLOY_URL/?deploy=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$work/public.html"
          cmp index.html "$work/public.html"
